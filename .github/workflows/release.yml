name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Signed + notarized assets are attached to the GitHub release only when the signing secrets exist:
#   MACOS_CERT_P12_BASE64  base64 of a Developer ID Application .p12
#   MACOS_CERT_PASSWORD    its password
#   NOTARY_KEY_P8_BASE64   base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER
# Without them the workflow only builds an ad-hoc signed artifact for inspection; releases are then
# produced locally with Scripts/build-app.sh (see README).
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Import signing certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
      - name: Build app (universal)
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [ -n "$NOTARY_KEY_B64" ] && [ -z "${NOTARY_KEY_PATH:-}" ]; then
            echo "$NOTARY_KEY_B64" | base64 --decode > AuthKey.p8
            echo "NOTARY_KEY_PATH=$PWD/AuthKey.p8" >> "$GITHUB_ENV"
            export NOTARY_KEY_PATH="$PWD/AuthKey.p8"
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="$(cat VERSION)"
          echo "$VERSION" > VERSION
          UNIVERSAL=1 VERSION="$VERSION" ./Scripts/build-app.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeensInKey
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
